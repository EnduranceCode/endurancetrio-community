<html class="has-endurance-navbar-fixed-top" data-th-lang="${#locale.language}" lang="en">
  <head data-th-replace="~{fragments/head :: head(${metadata})}">
    <title></title>
  </head>

  <body>
    <template data-th-replace="~{fragments/head :: googleTagManager}"></template>

    <nav data-th-replace="~{fragments/main-navbar :: main-navbar(${metadata})}"></nav>

    <main>
      <section class="hero has-background-grey-700">
        <div class="hero-body">
          <div class="container is-fullhd">
            <h1 class="title is-1" data-th-text="#{page.insights.title}"></h1>
            <p class="subtitle is-3" data-th-text="#{page.insights.subtitle}"></p>
          </div>
        </div>
      </section>

      <section class="section">
        <div data-th-if="${#lists.isEmpty(articles)}" data-th-remove="tag">
          <div class="endurance-box is-branded-thin has-text-centered">
            <p class="title is-4 m-4" data-th-text="#{page.insights.empty}"></p>
          </div>
        </div>

        <div data-th-unless="${#lists.isEmpty(articles)}" data-th-remove="tag">
          <div class="columns is-multiline">
            <div class="column is-full" data-th-each="article : ${articles}">
              <div data-th-replace="~{fragments/list-items :: insight-media(${article})}"></div>
            </div>
          </div>

          <nav class="pagination is-centered" data-th-if="${pagination.totalPages() > 1}"
            data-th-attr="aria-label=#{pagination.a11y.label}"
            role="navigation">
            <a class="pagination-previous"
              data-th-attr="disabled=${!pagination.hasPrevious()} ? 'disabled' : null"
              data-th-classappend="${!pagination.hasPrevious()} ? 'is-disabled'"
              data-th-href="${pagination.hasPrevious()}
                ? @{/{lang}/insights(lang=${language}, page=${pagination.pageNumber() - 1})}
                : null">
              <span class="icon">
                <i class="et et-chevron-double-left"></i>
              </span>
            </a>

            <a class="pagination-next"
              data-th-attr="disabled=${!pagination.hasNext()} ? 'disabled' : null"
              data-th-classappend="${!pagination.hasNext()} ? 'is-disabled'"
              data-th-href="${pagination.hasNext()}
                ? @{/{lang}/insights(lang=${language}, page=${pagination.pageNumber() + 1})}
                : null">
              <span class="icon">
                <i class="et et-chevron-double-right"></i>
              </span>
            </a>
          </nav>
        </div>
      </section>
    </main>

    <footer data-th-replace="~{fragments/footer :: footer}"></footer>
  </body>
</html>

<html class="has-endurance-navbar-fixed-top" data-th-lang="${#locale.language}" lang="en">
  <head>
    <title>Relay Results</title>
  </head>

  <body>
    <div class="table-container"
      data-th-fragment="relay-results-table(results, activeColumns, activeContributorColumns)">
      <table class="table is-fullwidth is-hoverable is-narrow"
        data-th-with="RelayResultColumns=${T(com.endurancetrio.app.event.enumerator.RelayResultColumns)}"
        data-sortable>
        <thead>
          <tr>
            <th class="is-narrow" scope="col"></th>
            <th class="is-narrow is-sorted-asc has-text-centered"
              data-th-if="${activeColumns.contains(RelayResultColumns.RANK.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.RANK.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort-ascending"></i></span>
                <span data-th-text="#{page.event.results.label.rank}"></span>
              </span>
            </th>
            <th data-th-if="${activeColumns.contains(RelayResultColumns.TEAM_NAME.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.TEAM_NAME.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort"></i></span>
                <span data-th-text="#{page.event.results.label.team}"></span>
              </span>
            </th>
            <th class="is-narrow has-text-centered"
              data-th-if="${activeColumns.contains(RelayResultColumns.AGE_GROUP.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.AGE_GROUP.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort"></i></span>
                <span data-th-text="#{page.event.results.label.ageGroup}"></span>
              </span>
            </th>
            <th class="is-narrow has-text-centered"
              data-th-if="${activeColumns.contains(RelayResultColumns.BIB.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.BIB.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort"></i></span>
                <span data-th-text="#{page.event.results.label.bib}"></span>
              </span>
            </th>
            <th class="is-narrow has-text-centered"
              data-th-if="${activeColumns.contains(RelayResultColumns.ATHLETES_COUNT.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.ATHLETES_COUNT.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort"></i></span>
                <span data-th-text="#{page.event.results.label.athletesCount}"></span>
              </span>
            </th>
            <th class="is-narrow has-text-centered"
              data-th-if="${activeColumns.contains(RelayResultColumns.SWIM.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.SWIM.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort"></i></span>
                <span data-th-text="#{page.event.results.label.swim}"></span>
              </span>
            </th>
            <th class="is-narrow has-text-centered"
              data-th-if="${activeColumns.contains(RelayResultColumns.FIRST_BIKE.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.FIRST_BIKE.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort"></i></span>
                <span data-th-text="#{page.event.results.label.firstBike}"></span>
              </span>
            </th>
            <th class="is-narrow has-text-centered"
              data-th-if="${activeColumns.contains(RelayResultColumns.FIRST_RUN.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.FIRST_RUN.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort"></i></span>
                <span data-th-text="#{page.event.results.label.firstRun}"></span>
              </span>
            </th>
            <th class="is-narrow has-text-centered"
              data-th-if="${activeColumns.contains(RelayResultColumns.T1.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.T1.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort"></i></span>
                <span data-th-text="#{page.event.results.label.t1}"></span>
              </span>
            </th>
            <th class="is-narrow has-text-centered"
              data-th-if="${activeColumns.contains(RelayResultColumns.BIKE.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.BIKE.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort"></i></span>
                <span data-th-text="#{page.event.results.label.bike}"></span>
              </span>
            </th>
            <th class="is-narrow has-text-centered"
              data-th-if="${activeColumns.contains(RelayResultColumns.T2.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.T2.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort"></i></span>
                <span data-th-text="#{page.event.results.label.t2}"></span>
              </span>
            </th>
            <th class="is-narrow has-text-centered"
              data-th-if="${activeColumns.contains(RelayResultColumns.RUN.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.RUN.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort"></i></span>
                <span data-th-text="#{page.event.results.label.run}"></span>
              </span>
            </th>
            <th class="is-narrow has-text-centered"
              data-th-if="${activeColumns.contains(RelayResultColumns.SECOND_RUN.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.SECOND_RUN.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort"></i></span>
                <span data-th-text="#{page.event.results.label.secondRun}"></span>
              </span>
            </th>
            <th class="is-narrow has-text-centered"
              data-th-if="${activeColumns.contains(RelayResultColumns.T3.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.T3.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort"></i></span>
                <span data-th-text="#{page.event.results.label.t3}"></span>
              </span>
            </th>
            <th class="is-narrow has-text-centered"
              data-th-if="${activeColumns.contains(RelayResultColumns.SECOND_BIKE.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.SECOND_BIKE.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort"></i></span>
                <span data-th-text="#{page.event.results.label.secondBike}"></span>
              </span>
            </th>
            <th class="is-narrow has-text-centered has-text-weight-semibold"
              data-th-if="${activeColumns.contains(RelayResultColumns.TOTAL.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.TOTAL.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort"></i></span>
                <span data-th-text="#{page.event.results.label.total}"></span>
              </span>
            </th>
            <th class="is-narrow has-text-centered"
              data-th-if="${activeColumns.contains(RelayResultColumns.GAP.getCode())}"
              data-th-attr="data-sort=${RelayResultColumns.GAP.getCode()}"
              scope="col">
              <span class="icon-text">
                <span class="icon"><i class="et et-sort"></i></span>
                <span data-th-text="#{page.event.results.label.gap}"></span>
              </span>
            </th>
          </tr>
        </thead>
        <tbody>
          <th:block data-th-each="relay : ${results}">
            <tr data-th-classappend="${relay.penalty() != null} ? 'has-text-grey-light'">
              <td>
                <button class="expand"
                  data-th-if="${!#lists.isEmpty(relay.individualResults())}"
                  data-th-attr="aria-label=#{page.event.results.a11y.toggle}"
                  data-expand
                  type="button"
                  aria-expanded="false">
                </button>
              </td>
              <td class="is-narrow has-text-centered"
                data-th-if="${activeColumns.contains(RelayResultColumns.RANK.getCode())}">
                <span data-th-if="${relay.penalty() == null}"
                  data-th-text="${relay.rank()}">
                </span>
                <span class="tag is-light"
                  data-th-unless="${relay.penalty() == null}"
                  data-th-text="${relay.penalty()}">
                </span>
              </td>
              <td data-th-if="${activeColumns.contains(RelayResultColumns.TEAM_NAME.getCode())}"
                data-th-text="${relay.teamName()}">
              </td>
              <td class="is-narrow has-text-centered"
                data-th-if="${activeColumns.contains(RelayResultColumns.AGE_GROUP.getCode())}"
                data-th-text="${relay.ageGroup() != null ? relay.ageGroup().code : ''}">
              </td>
              <td class="is-narrow has-text-centered"
                data-th-if="${activeColumns.contains(RelayResultColumns.BIB.getCode())}"
                data-th-text="${relay.bib()}">
              </td>
              <td class="is-narrow has-text-centered"
                data-th-if="${activeColumns.contains(RelayResultColumns.ATHLETES_COUNT.getCode())}"
                data-th-text="${relay.athletesCount()}">
              </td>
              <td class="is-narrow has-text-centered"
                data-th-if="${activeColumns.contains(RelayResultColumns.SWIM.getCode())}"
                data-th-text="${T(com.endurancetrio.app.common.utils.DurationFormatter).format(relay.swim())}">
              </td>
              <td class="is-narrow has-text-centered"
                data-th-if="${activeColumns.contains(RelayResultColumns.FIRST_BIKE.getCode())}"
                data-th-text="${T(com.endurancetrio.app.common.utils.DurationFormatter).format(relay.firstBike())}">
              </td>
              <td class="is-narrow has-text-centered"
                data-th-if="${activeColumns.contains(RelayResultColumns.FIRST_RUN.getCode())}"
                data-th-text="${T(com.endurancetrio.app.common.utils.DurationFormatter).format(relay.firstRun())}">
              </td>
              <td class="is-narrow has-text-centered"
                data-th-if="${activeColumns.contains(RelayResultColumns.T1.getCode())}"
                data-th-text="${T(com.endurancetrio.app.common.utils.DurationFormatter).format(relay.t1())}">
              </td>
              <td class="is-narrow has-text-centered"
                data-th-if="${activeColumns.contains(RelayResultColumns.BIKE.getCode())}"
                data-th-text="${T(com.endurancetrio.app.common.utils.DurationFormatter).format(relay.bike())}">
              </td>
              <td class="is-narrow has-text-centered"
                data-th-if="${activeColumns.contains(RelayResultColumns.T2.getCode())}"
                data-th-text="${T(com.endurancetrio.app.common.utils.DurationFormatter).format(relay.t2())}">
              </td>
              <td class="is-narrow has-text-centered"
                data-th-if="${activeColumns.contains(RelayResultColumns.RUN.getCode())}"
                data-th-text="${T(com.endurancetrio.app.common.utils.DurationFormatter).format(relay.run())}">
              </td>
              <td class="is-narrow has-text-centered"
                data-th-if="${activeColumns.contains(RelayResultColumns.SECOND_RUN.getCode())}"
                data-th-text="${T(com.endurancetrio.app.common.utils.DurationFormatter).format(relay.secondRun())}">
              </td>
              <td class="is-narrow has-text-centered"
                data-th-if="${activeColumns.contains(RelayResultColumns.T3.getCode())}"
                data-th-text="${T(com.endurancetrio.app.common.utils.DurationFormatter).format(relay.t3())}">
              </td>
              <td class="is-narrow has-text-centered"
                data-th-if="${activeColumns.contains(RelayResultColumns.SECOND_BIKE.getCode())}"
                data-th-text="${T(com.endurancetrio.app.common.utils.DurationFormatter).format(relay.secondBike())}">
              </td>
              <td class="is-narrow has-text-centered has-text-weight-semibold"
                data-th-if="${activeColumns.contains(RelayResultColumns.TOTAL.getCode())}">
                <span data-th-if="${relay.penalty() == null}"
                  data-th-text="${T(com.endurancetrio.app.common.utils.DurationFormatter).format(relay.total())}">
                </span>
                <span class="tag is-light"
                  data-th-unless="${relay.penalty() == null}"
                  data-th-text="${relay.penalty()}">
                </span>
              </td>
              <td class="is-narrow has-text-centered"
                data-th-if="${activeColumns.contains(RelayResultColumns.GAP.getCode())}"
                data-th-text="${T(com.endurancetrio.app.common.utils.DurationFormatter).format(relay.gap())}">
              </td>
            </tr>
            <tr class="is-hidden"
              data-th-if="${!#lists.isEmpty(relay.individualResults())}"
              data-expand-content>
              <td>
                <div class="box is-outlined m-3">
                  <div data-th-replace="~{fragments/individual-results :: individual-results-table(${relay.individualResults()}, ${activeContributorColumns})}"></div>
                </div>
              </td>
            </tr>
          </th:block>
        </tbody>
      </table>
    </div>

    <div data-th-with="AgeGroup=${T(com.endurancetrio.data.competitor.model.enumerator.AgeGroup)}"
      data-th-fragment="relay-results-tabs(relayResults, activeColumns, activeContributorColumns, language)">
      <div class="tabs">
        <ul data-tabs>
          <li data-th-each="entry : ${relayResults}"
            data-th-attr="data-target=${entry.key.name()}"
            data-th-classappend="${entry.key.name() == AgeGroup.OPEN.getCode()} ? 'is-active'">
            <a data-th-text="${entry.key.name() == AgeGroup.OPEN.getCode()
          ? (language == 'pt' ? entry.key.denominationPT : entry.key.denominationEN)
          : entry.key.code}">
            </a>
          </li>
        </ul>
      </div>

      <div data-th-each="entry : ${relayResults}"
        data-th-classappend="${entry.key.name() == AgeGroup.OPEN.getCode()} ? 'is-active'"
        data-th-id="${entry.key.name()}"
        data-tab-content>
        <div data-th-replace="~{fragments/relay-results :: relay-results-table(${entry.value}, ${activeColumns}, ${activeContributorColumns})}"></div>
      </div>
    </div>
  </body>
</html>

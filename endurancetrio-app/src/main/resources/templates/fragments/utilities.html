<html class="has-endurance-navbar-fixed-top" data-th-lang="${#locale.language}" lang="en">
  <head>
    <title>Utilities</title>
  </head>

  <body>
    <div class="box is-64x64 is-outlined is-light has-text-centered" data-th-fragment="box-date(date, pattern)">
      <div class="has-text-weight-bold" data-th-if="${pattern == 'dd-MM-yyyy'}">
        <p data-th-text="${#temporals.format(date, 'dd-MM')}"></p>
        <p data-th-text="${#temporals.format(date, 'yyyy')}"></p>
      </div>

      <div class="has-text-weight-bold" data-th-if="${pattern == 'dd-MMM'}">
        <p class="title is-5 mb-0" data-th-text="${#temporals.format(date, 'dd')}"></p>
        <p class="title is-6 mb-0" data-th-text="${#temporals.format(date, 'MMM')}"></p>
      </div>
    </div>

    <div data-th-fragment="combined-long-date(startDate, endDate)" data-th-remove="tag">
      <span data-th-if="${startDate == endDate}"
        data-th-text="${#temporals.format(startDate, 'LONG')}">
      </span>

      <span data-th-if="${startDate != endDate and #locale.language == 'pt' and #temporals.format(startDate, 'yyyy-MM') == #temporals.format(endDate, 'yyyy-MM')}"
        data-th-text="${#temporals.format(startDate, 'd') + ' a ' + #temporals.format(endDate, 'LONG')}">
      </span>

      <span data-th-if="${startDate != endDate and #locale.language == 'pt' and #temporals.format(startDate, 'yyyy-MM') != #temporals.format(endDate, 'yyyy-MM')}"
        data-th-text="${#temporals.format(startDate, 'd') + ' de ' + #temporals.format(startDate, 'MMMM') + ' a ' + #temporals.format(endDate, 'LONG')}">
      </span>

      <span data-th-if="${startDate != endDate and #locale.language != 'pt' and #temporals.format(startDate, 'yyyy-MM') == #temporals.format(endDate, 'yyyy-MM')}"
        data-th-text="${#temporals.format(startDate, 'MMMM d')} + ' to ' + ${#temporals.format(endDate, 'd, yyyy')}">
      </span>

      <span data-th-if="${startDate != endDate and #locale.language != 'pt' and #temporals.format(startDate, 'yyyy-MM') != #temporals.format(endDate, 'yyyy-MM')}"
        data-th-text="${#temporals.format(startDate, 'MMM d') + ' to ' + #temporals.format(endDate, 'LONG')}">
      </span>
    </div>

    <div data-th-fragment="location(city, county, district)" data-th-remove="tag">
      <span data-th-if="${city == county}" data-th-text="${city} + ', ' + ' (' + ${district} + ')'"></span>
      <span data-th-unless="${city == county}" data-th-text="${city} + ', ' + ${county} + ' (' + ${district} + ')'"></span>
    </div>
  </body>
</html>

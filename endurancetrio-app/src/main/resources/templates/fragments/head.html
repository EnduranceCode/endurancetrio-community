<html class="has-endurance-navbar-fixed-top" data-th-lang="${#locale.language}" lang="en">
  <head data-th-fragment="head(metadata)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title data-th-text="${metadata.title}"></title>

    <meta name="color-scheme" content="light">
    <meta name="description" data-th-content="${metadata.description}">
    <meta name="format-detection" content="telephone=no">
    <meta name="google-adsense-account" data-th-content="${metadata.googleAdsenseId}">
    <meta name="robots" content="index,follow">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" data-th-content="${metadata.twitterSite}">

    <meta data-th-content="${metadata.title}" property="og:title">
    <meta data-th-content="${metadata.description}" property="og:description">
    <meta property="og:type" content="website">
    <meta data-th-content="${metadata.canonicalUrl}" property="og:url">
    <meta property="og:site_name" content="EnduranceTrio">
    <meta data-th-content="${#locale}" property="og:locale">
    <meta data-th-content="${metadata.ogImage}" property="og:image">
    <meta data-th-content="${metadata.ogImageWidth}" property="og:image:width">
    <meta data-th-content="${metadata.ogImageHeight}" property="og:image:height">
    <meta data-th-content="${metadata.facebookPageId}" property="fb:pages">

    <!-- Google Tag Manager -->
    <script data-type="application/javascript" data-name="google-tag-manager" type="text/plain">
    (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-KK23WCG6');
    </script>
    <!-- End Google Tag Manager -->

    <link data-th-href="${metadata.canonicalUrl}" rel="canonical">
    <link data-th-if="${metadata.hreflangUrlEn != null}" data-th-href="${metadata.hreflangUrlEn}" rel="alternate"
      hreflang="en">
    <link data-th-if="${metadata.hreflangUrlPt != null}" data-th-href="${metadata.hreflangUrlPt}" rel="alternate"
      hreflang="pt">
    <link data-th-if="${metadata.hreflangUrlEn != null}" data-th-href="${metadata.hreflangUrlEn}" rel="alternate"
      hreflang="x-default">
    <link data-th-href="@{/favicon.ico}" rel="icon" sizes="32x32">
    <link data-th-href="@{/favicon.svg}" type="image/svg+xml" rel="icon">
    <link data-th-href="@{/apple-touch-icon.png}" rel="apple-touch-icon">

    <!-- JSON-LD structured data, serialized server-side (see JsonLdUtils) -->
    <script data-th-if="${metadata.jsonLd != null}" data-th-utext="${metadata.jsonLd}"
      type="application/ld+json">
    </script>

    <link data-th-href="@{/css/style.css}" rel="stylesheet">
    <script data-th-src="@{/js/script.js}" defer></script>
  </head>

  <body>
    <template data-th-fragment="googleTagManager">
      <!-- Google Tag Manager (noscript) -->
      <noscript>
        <iframe
          data-name="google-tag-manager"
          data-src="https://www.googletagmanager.com/ns.html?id=GTM-KK23WCG6"
          title="Google Tag Manager"
          style="display:none;visibility:hidden"
          height="0"
          width="0">
        </iframe>
      </noscript>
      <!-- End Google Tag Manager (noscript) -->
    </template>
  </body>
</html>

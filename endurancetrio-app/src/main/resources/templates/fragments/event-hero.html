<html class="has-endurance-navbar-fixed-top" data-th-lang="${#locale.language}" lang="en">
  <head>
    <title>Event Hero</title>
  </head>

  <body>
    <section class="hero has-background-grey-700"
      data-th-fragment="event-hero(language, event, year, articlesCount, currentTab)">
      <div class="hero-body">
        <div class="container is-fullhd">
          <h1 class="title is-1" data-th-text="${event.title()}"></h1>

          <p class="subtitle is-3">
            <span data-th-replace="~{fragments/utilities :: combined-long-date(${event.startDate}, ${event.endDate})}"></span>
            <span class="icon">
              <i class="et et-tally-mark-1"></i>
            </span>
            <span data-th-replace="~{fragments/utilities :: location(${event.city}, ${event.county}, ${event.district})}"></span>
          </p>
        </div>
      </div>

      <div class="hero-foot">
        <div class="container is-fullhd">
          <div class="tabs is-right">
            <ul>
              <li data-th-classappend="${currentTab == 'overview'} ? 'is-active' : ''">
                <a data-th-href="@{/{language}/events/{year}/{id}/overview(language=${language}, year=${year}, id=${event.id()})}"
                  data-th-text="#{page.event.tab.overview}"></a>
              </li>
              <li data-th-if="${articlesCount > 0}" data-th-classappend="${currentTab == 'insights'} ? 'is-active' : ''">
                <a data-th-href="@{/{language}/events/{year}/{id}/insights(language=${language}, year=${year}, id=${event.id()})}"
                  data-th-text="#{page.event.tab.insights}"></a>
              </li>
              <li data-th-if="${event.races().size() > 0}"
                data-th-classappend="${currentTab == 'results'} ? 'is-active' : ''">
                <a data-th-href="@{/{language}/events/{year}/{eventId}/results/{raceId}(language=${language}, year=${year}, eventId=${event.id()}, raceId=${event.races().getFirst().id()})}"
                  data-th-text="#{page.event.tab.results}"></a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>

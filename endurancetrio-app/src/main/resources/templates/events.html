<html class="has-endurance-navbar-fixed-top" data-th-lang="${#locale.language}" lang="en">
  <head data-th-replace="~{fragments/head :: head(${metadata})}">
    <title></title>
  </head>

  <body>
    <template data-th-replace="~{fragments/head :: googleTagManager}"></template>

    <nav data-th-replace="~{fragments/main-navbar :: main-navbar(${metadata})}"></nav>

    <main>
      <section class="hero has-background-grey-700">
        <div class="hero-body">
          <div class="container is-fullhd">
            <h1 class="title is-1" data-th-text="#{page.events.title}"></h1>
            <p class="subtitle is-3" data-th-text="#{page.events.subtitle}"></p>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="endurance-box is-branded-thin is-branded-faded has-background-grey-200">
          <form class="columns is-multiline" data-th-action="${eventsUrl}" role="search" method="get">
            <div class="column is-two-fifths">
              <div class="field">
                <label class="label is-sr-only"
                  data-th-text="#{page.events.filter.district}"
                  for="events-district">
                </label>
                <div class="control">
                  <div class="select is-fullwidth is-small">
                    <select id="events-district"
                      name="district"
                      data-event-filter-district="events-county">
                      <option data-th-value="''" data-th-selected="${filter.district() == null}"
                        data-th-text="#{page.events.filter.anyDistrict}"
                        value="">
                      </option>
                      <option data-th-each="district : ${countiesByDistrict.keySet()}"
                        data-th-value="${district}"
                        data-th-selected="${filter.district() == district}"
                        data-th-text="${district}">
                      </option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <div class="column is-two-fifths">
              <div class="field">
                <label class="label is-sr-only"
                  data-th-text="#{page.events.filter.county}"
                  for="events-county">
                </label>
                <div class="control">
                  <div class="select is-fullwidth is-small">
                    <select id="events-county" name="county">
                      <option data-th-value="''" data-th-selected="${filter.county() == null}"
                        data-th-text="#{page.events.filter.anyCounty}"
                        value="">
                      </option>
                      <optgroup data-th-each="districtCounties : ${countiesByDistrict}"
                        data-th-attr="data-district=${districtCounties.key}, hidden=${filter.district() != null and filter.district() != districtCounties.key} ? 'hidden' : null"
                        data-th-label="${districtCounties.key}"
                        label="Aveiro">
                        <option data-th-each="county : ${districtCounties.value}"
                          data-th-attr="data-district=${districtCounties.key}, hidden=${filter.district() != null and filter.district() != districtCounties.key} ? 'hidden' : null, disabled=${filter.district() != null and filter.district() != districtCounties.key} ? 'disabled' : null"
                          data-th-value="${county}"
                          data-th-selected="${filter.county() == county}"
                          data-th-text="${county}">
                        </option>
                      </optgroup>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <div class="column is-one-fifth">
              <div class="field">
                <label class="label is-sr-only"
                  data-th-text="#{page.events.filter.year}"
                  for="events-year">
                </label>
                <div class="control">
                  <div class="select is-fullwidth is-small">
                    <select id="events-year" name="year">
                      <option data-th-value="''"
                        data-th-selected="${filter.year() == null}"
                        data-th-text="#{page.events.filter.anyYear}"
                        value="">
                      </option>
                      <option data-th-each="year : ${years}"
                        data-th-value="${year}"
                        data-th-selected="${filter.year() == year}"
                        data-th-text="${year}">
                      </option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <div class="column">
              <div class="field has-addons">
                <div class="control is-expanded">
                  <label class="label is-sr-only" data-th-text="#{page.events.search.placeholder}"
                    for="event-search">
                  </label>
                  <input class="input is-small"
                    id="event-search"
                    name="q"
                    data-th-value="${filter.q()}"
                    data-th-placeholder="#{page.events.search.placeholder}"
                    type="search">
                </div>
                <div class="control">
                  <button class="button is-small is-primary"
                    data-th-attr="aria-label=#{page.events.search.submit}"
                    data-loading
                    type="submit">
                    <span class="icon"><i class="et et-magnify"></i></span>
                    <span data-th-text="#{page.events.search.submit}"></span>
                  </button>
                </div>
              </div>
            </div>
          </form>

          <div class="level">
            <div class="level-left">
              <div class="level-item" data-th-if="${pagination.totalItems() > 0}">
                <span data-th-text="#{page.events.results(${pagination.totalItems()})}">
                </span>
              </div>
              <div class="level-item has-text-centered-mobile" data-th-unless="${pagination.totalItems() > 0}">
                <span data-th-text="${isFiltered ? #messages.msg('page.events.empty.filtered') : #messages.msg('page.events.empty')}">
                </span>
              </div>
            </div>
            <div class="level-right" data-th-if="${isFiltered}">
              <div class="level-item">
                <a class="button is-small is-dark"
                  data-th-href="${eventsUrl}"
                  data-th-text="#{page.events.filter.clear}">
                </a>
              </div>
            </div>
          </div>
        </div>

        <div class="columns is-multiline">
          <div class="column is-full" data-th-each="event : ${events}">
            <div data-th-replace="~{fragments/list-items :: simple-event(${event})}"></div>
          </div>
        </div>

        <nav class="pagination is-centered"
          data-th-if="${pagination.totalPages() > 1}"
          data-th-attr="aria-label=#{pagination.a11y.label}"
          role="navigation">
          <a class="pagination-previous"
            data-th-attr="disabled=${!pagination.hasPrevious()} ? 'disabled' : null"
            data-th-classappend="${!pagination.hasPrevious()} ? 'is-disabled'"
            data-th-href="${paginationPreviousUrl}">
            <span class="icon">
              <i class="et et-chevron-double-left"></i>
            </span>
          </a>

          <a class="pagination-next"
            data-th-attr="disabled=${!pagination.hasNext()} ? 'disabled' : null"
            data-th-href="${paginationNextUrl}"
            data-th-classappend="${!pagination.hasNext()} ? 'is-disabled'">
            <span class="icon">
              <i class="et et-chevron-double-right"></i>
            </span>
          </a>

          <ul class="pagination-list"
            data-th-with="firstPage=${pageWindow.pages().isEmpty() ? null : pageWindow.pages()[0]}, lastPage=${pageWindow.pages().isEmpty() ? null : pageWindow.pages()[pageWindow.pages().size() - 1]}">
            <li data-th-if="${firstPage != null}">
              <a class="pagination-link"
                data-th-attr="aria-label=${#messages.msg('pagination.a11y.goto', firstPage + 1)}"
                data-th-href="${paginationUrls.get(firstPage)}"
                data-th-classappend="${firstPage == pagination.pageNumber()} ? 'is-current'"
                data-th-text="${firstPage + 1}">
              </a>
            </li>
            <li data-th-if="${pageWindow.gapBefore()}">
              <span class="pagination-ellipsis pagination-link">&hellip;</span>
            </li>
            <li data-th-each="page : ${pageWindow.pages()}"
              data-th-if="${page != firstPage and page != lastPage}">
              <a class="pagination-link"
                data-th-attr="aria-label=${#messages.msg('pagination.a11y.goto', page + 1)}"
                data-th-href="${paginationUrls.get(page)}"
                data-th-classappend="${page == pagination.pageNumber()} ? 'is-current'"
                data-th-text="${page + 1}">
              </a>
            </li>
            <li data-th-if="${pageWindow.gapAfter()}">
              <span class="pagination-ellipsis pagination-link">&hellip;</span>
            </li>
            <li data-th-if="${lastPage != null and lastPage != firstPage}">
              <a class="pagination-link"
                data-th-attr="aria-label=${#messages.msg('pagination.a11y.goto', lastPage + 1)}"
                data-th-href="${paginationUrls.get(lastPage)}"
                data-th-classappend="${lastPage == pagination.pageNumber()} ? 'is-current'"
                data-th-text="${lastPage + 1}">
              </a>
            </li>
          </ul>
        </nav>
      </section>
    </main>

    <footer data-th-replace="~{fragments/footer :: footer}"></footer>
  </body>
</html>
